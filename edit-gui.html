<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑图鉴 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">    <p class="entry-back"><a href="projects.html">← 返回项目</a></p>

    <!-- 第一关：组织验证 -->
    <section id="gateSection" class="gate">
      <h1>编辑图鉴</h1>
      <p class="lead">编纂条目需要先通过组织验证。</p>
      <div id="gateMount"></div>
    </section>

    <!-- 验证通过后才显示 -->
    <section id="editSection" hidden>
      <h1>编辑图鉴</h1>
      <p class="lead">点条目进入编辑；也可以新增条目或查阅旧图鉴。</p>
      <p class="muted gui-note">这里只列出已存入数据库的条目；公开图鉴里另外 6 条是示例数据，不在此列。</p>

      <div class="gui-toolbar">
        <div class="gui-search">
          <svg class="gui-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="guiSearch" type="search" placeholder="搜索条目名…" autocomplete="off" aria-label="搜索条目名">
        </div>
      </div>

      <div class="gui-actions">
        <a class="btn" href="add-gui.html">增加条目</a>
        <a class="btn btn-ghost" href="tips.html?from=edit">查看情报</a>
        <a class="btn btn-ghost" href="old-gui.html">查看旧图鉴</a>
      </div>

      <p class="gui-count muted" id="guiCount">正在载入…</p>
      <div class="gui-list" id="guiList"></div>
      <div class="gui-empty" id="guiEmpty" hidden><p>没有找到匹配的条目。</p></div>
    </section>  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/gui-entries.js"></script>
  <script src="js/gui-gate.js"></script>
  <script src="js/gui-data.js"></script>
  <script src="js/edit-gui.js"></script>
</body>
</html>
