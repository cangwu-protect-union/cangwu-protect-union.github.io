<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本站统计 · CPU</title>
  <meta name="description" content="CPU及回合制游戏工作室官方网站的访问量、功能更新与成员贡献度">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/style-2.css">
  <link rel="stylesheet" href="css/style-3.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>本站统计</h1>
      <p class="lead">CPU及回合制游戏工作室官方网站的访问量、功能更新与成员贡献度。</p>
    </section>

    <section>
      <p class="entry-back"><a href="projects.html">← 返回项目</a></p>

      <div class="stats-ranges" role="group" aria-label="时间范围">
        <button type="button" class="btn btn-ghost is-active" data-days="7">最近一周</button>
        <button type="button" class="btn btn-ghost" data-days="30">最近一个月</button>
        <button type="button" class="btn btn-ghost" data-days="365">最近一年</button>
      </div>
      <p class="stats-status muted" id="statsStatus">正在载入…</p>
    </section>

    <section id="viewsSection">
      <h2>流量</h2>
      <div class="stats-kpis">
        <div class="stats-kpi">
          <strong id="kpiPv">—</strong>
          <span>浏览量 PV</span>
        </div>
        <div class="stats-kpi">
          <strong id="kpiUv">—</strong>
          <span>独立访客 UV</span>
        </div>
      </div>

      <div class="stats-chart" id="viewsChart" aria-hidden="true"></div>
      <p class="muted" id="viewsEmpty" hidden>这个范围内还没有访问数据。</p>

      <p class="stats-label">访问最多的页面</p>
      <ul class="stats-pages" id="pagesList"></ul>
      <p class="muted" id="pagesEmpty" hidden>还没有页面访问记录。</p>
    </section>

    <section>
      <h2>更新记录</h2>
      <ul class="stats-updates" id="updatesList"></ul>
      <p class="muted" id="updatesEmpty" hidden>这个范围内本站没有功能更新。</p>
    </section>

    <section id="contribSection">
      <h2>成员贡献度</h2>
      <div class="stats-table" id="contribTable"></div>
      <p class="muted" id="editsEmpty" hidden>这个范围内还没有成员编辑记录。</p>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="guitu/data/config.js"></script>
  <script src="js/members.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/visit-beacon.js"></script>

</body>
</html>
