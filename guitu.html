<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鬼图鉴 · CPU</title>
  <meta name="description" content="CPU 鬼图鉴：鬼与灵异现象的公开数据库">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>鬼图鉴</h1>
      <p class="lead">组织观测到的鬼与灵异现象的公开记录。按条目名检索，点击条目查看详情。</p>
    </section>

    <section>
      <div class="gui-toolbar">
        <div class="gui-search">
          <svg class="gui-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="guiSearch" type="search" placeholder="搜索条目名…" autocomplete="off" aria-label="搜索条目名">
        </div>
        <a class="btn" href="add-gui.html">增加条目</a>
      </div>

      <p class="gui-count muted" id="guiCount">正在载入…</p>

      <div class="gui-list" id="guiList"></div>

      <div class="gui-empty" id="guiEmpty" hidden>
        <p>没有找到匹配的条目。</p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/gui-entries.js"></script>
  <script src="js/gui-data.js"></script>
  <script src="js/guitu.js"></script>
</body>
</html>
