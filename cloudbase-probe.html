<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudBase 可行性探测</title>
  <meta name="robots" content="noindex">
  <style>
    body{font-family:system-ui,"Microsoft YaHei",monospace;padding:24px;line-height:1.8;max-width:900px}
    h1{font-size:1.3rem}
    .box{border:1px solid #ddd;border-radius:8px;padding:14px 16px;margin:12px 0;font-family:Consolas,monospace;font-size:.9rem;white-space:pre-wrap;word-break:break-all}
    .ok{color:#087443;border-color:#087443;background:#f0fdf6}
    .bad{color:#b42318;border-color:#b42318;background:#fdf2f1}
    .wait{color:#666}
    input{font:inherit;padding:8px 10px;border:1px solid #ccc;border-radius:6px;width:340px}
    button{font:inherit;padding:8px 16px;border:0;border-radius:6px;background:#0969da;color:#fff;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}
  </style>
</head>
<body>
  <h1>CloudBase 可行性探测</h1>
  <p>目的：确认 <code>cangwu-protect-union.github.io</code> 能否调用 CloudBase（安全域名是否放行）。
     只做「匿名登录 + 读一次数据库」，不写入任何数据。</p>

  <p>
    环境 ID：<input id="envId" placeholder="例如 gui-db-1a2b3c4d5e6f7" autocomplete="off">
    集合名：<input id="colName" value="gui_entries" style="width:180px">
  </p>
  <p><button id="run">开始探测</button></p>

  <div id="out"></div>

<script type="module">
const out = document.getElementById("out");
const btn = document.getElementById("run");

function errText(e) {
  if (!e) return "未知错误";
  if (typeof e === "string") return e;
  const parts = [];
  for (const k of ["code", "message", "errMsg", "name", "statusCode"]) {
    if (e[k] !== undefined) parts.push(k + ": " + e[k]);
  }
  if (!parts.length) {
    try { return JSON.stringify(e, Object.getOwnPropertyNames(e)); } catch (_) { return String(e); }
  }
  return parts.join("\n");
}

function line(text, cls) {
  const d = document.createElement("div");
  d.className = "box " + (cls || "wait");
  d.textContent = text;
  out.appendChild(d);
  return d;
}

btn.addEventListener("click", async () => {
  const envId = document.getElementById("envId").value.trim();
  const colName = document.getElementById("colName").value.trim() || "gui_entries";
  out.innerHTML = "";

  if (!envId) { line("请先填写环境 ID", "bad"); return; }
  btn.disabled = true;

  const t0 = Date.now();
  line("1) 加载 CloudBase SDK …");

  let cloudbase;
  try {
    const mod = await import("./js/lib/cloudbase.bundle.js");
    cloudbase = mod.default || mod;
    line("1) SDK 加载成功（" + (Date.now() - t0) + "ms）", "ok");
  } catch (e) {
    line("1) SDK 加载失败：" + e.message, "bad");
    btn.disabled = false;
    return;
  }

  line("2) 初始化 + 匿名登录 …");
  let app, authInstance;
  try {
    const t1 = Date.now();
    app = cloudbase.init({ env: envId });
    authInstance = app.auth({ persistence: "local" });
    if (!authInstance.hasLoginState || !(await authInstance.hasLoginState())) {
      await authInstance.signInAnonymously();
    }
    line("2) 匿名登录成功（" + (Date.now() - t1) + "ms）", "ok");
  } catch (e) {
    const msg = e;
    line("2) 匿名登录失败：" + errText(msg) +
         "\n\n排查：① 环境 ID 是否正确 ② 是否已在「身份认证/登录方式」启用匿名登录 ③ 安全域名是否已添加本域名",
         "bad");
    btn.disabled = false;
    return;
  }

  line("3) 读取集合 " + colName + " …");
  try {
    const t2 = Date.now();
    const db = app.database({ auth: authInstance });   /* 关键：显式传 auth */
    const res = await db.collection(colName).limit(3).get();
    line("3) 读取成功（" + (Date.now() - t2) + "ms），返回 " +
         (res.data ? res.data.length : 0) + " 条\n" + JSON.stringify(res.data, null, 2).slice(0, 600), "ok");
  } catch (e) {
    const msg = e;
    line("3) 读取失败：" + errText(msg) +
         "\n\n排查：① 集合 " + colName + " 是否已创建 ② 集合安全规则是否允许读取", "bad");
    btn.disabled = false;
    return;
  }

  line("✅ 全部通过：安全域名放行，CloudBase 可用。可以把结果告诉 DeepSeek。", "ok");
  btn.disabled = false;
});
</script>
</body>
</html>
