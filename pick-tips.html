<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>引用情报 · 鬼图鉴 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-pick-bar">

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <p class="entry-back"><a id="backLink" href="add-gui.html">← 返回增加条目</a></p>

    <section class="hero">
      <h1>引用情报</h1>
      <p class="lead">
        勾选要引用的情报。确认后，情报的正文、图片、标签会按顺序复制到「增加条目」表单里，
        并在正文末尾留下指向原情报的链接（标题不会被复制）。
      </p>
    </section>

    <section>
      <div class="gui-toolbar">
        <div class="gui-search">
          <svg class="gui-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="pickSearch" type="search" placeholder="搜索情报标题…" autocomplete="off" aria-label="搜索情报标题">
        </div>
      </div>

      <p class="gui-count muted" id="pickCount">正在载入…</p>
      <div class="pick-list" id="pickList"></div>
      <div class="gui-empty" id="pickEmpty" hidden><p>还没有任何情报可以引用。</p></div>
    </section>
  </main>

  <!-- 固定在底部、不随页面滚动的操作栏 -->
  <div class="pick-bar" id="pickBar">
    <span class="pick-bar-count" id="pickBarCount">未选择</span>
    <button type="button" class="btn btn-ghost" id="pickCancel">取消</button>
    <button type="button" class="btn" id="pickConfirm" disabled>确定</button>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/gui-entries.js"></script>
  <script src="js/gui-gate.js"></script>
  <script src="js/gui-data.js"></script>
  <script src="js/pick-tips.js"></script>
</body>
</html>
