<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>增加条目 · 鬼图鉴 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <p class="entry-back"><a href="guitu.html">← 返回图鉴</a></p>

    <!-- ===== 第一关：组织验证 ===== -->
    <section id="gateSection" class="gate">
      <h1>组织验证</h1>
      <p class="lead">编纂者需通过验证才能增加条目。请回答以下问题，答案需完全一致。</p>

      <form id="gateForm" autocomplete="off">
        <div class="field">
          <label for="q1">问题一：CPU远征行动指定前哨站</label>
          <input id="q1" name="q1" type="text" placeholder="请输入答案">
        </div>
        <div class="field">
          <label for="q2">问题二：CPU远征行动指定驱鬼补给</label>
          <input id="q2" name="q2" type="text" placeholder="请输入答案">
        </div>
        <p class="gate-error" id="gateError" hidden></p>
        <div class="gate-actions">
          <button type="submit" class="btn">验证</button>
          <a class="btn btn-ghost" href="guitu.html">取消</a>
        </div>
      </form>
    </section>

    <!-- ===== 第二关：增加条目表单 ===== -->
    <section id="formSection" hidden>
      <h1>增加条目</h1>
      <p class="lead">填写完毕后点击「确认」，条目会立即进入图鉴，可被搜索和查看。</p>

      <form id="entryForm" autocomplete="off">
        <div class="field">
          <label for="fTitle">标题</label>
          <input id="fTitle" name="title" type="text" placeholder="例：鬼固山异变" maxlength="60">
        </div>

        <div class="field">
          <label for="fBody">正文 <span class="muted">（段落之间空一行）</span></label>
          <textarea id="fBody" name="body" rows="12" placeholder="第一段……&#10;&#10;第二段……"></textarea>
        </div>

        <div class="field">
          <label>图片 <span class="muted">（可多选、可拖拽、可粘贴；留空会自动生成占位图）</span></label>

          <div class="dropzone" id="dropzone">
            <div class="dz-emoji">🖼</div>
            <p class="dz-main">把图片拖到这里，或者 <button type="button" class="link-btn" id="pickImageBtn">选择文件</button></p>
            <p class="dz-sub">支持多选 · 也可以直接 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴截图 · 支持 HEIC</p>
          </div>

          <input id="fImageFile" type="file" accept="image/*" multiple hidden>

          <div class="thumbs" id="thumbs" hidden></div>

          <input id="fImage" name="image" type="url" placeholder="也可以粘贴单张图片网址 https://…">
        </div>

        <div class="field">
          <label for="fTags">标签 <span class="muted">（用逗号分隔，可留空）</span></label>
          <input id="fTags" name="tags" type="text" placeholder="异次元, 已镇压">
        </div>

        <p class="gate-error" id="formError" hidden></p>

        <div class="gate-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
          <button type="submit" class="btn">确认</button>
        </div>
      </form>
    </section>

    <!-- ===== 完成提示 ===== -->
    <section id="doneSection" hidden>
      <h1>条目已上传</h1>
      <p class="lead" id="doneText"></p>

      <p class="gate-actions">
        <a class="btn" id="doneView" href="guitu.html">查看该条目</a>
        <a class="btn btn-ghost" href="guitu.html">返回图鉴</a>
      </p>

      <!-- 云端失败时才显示 -->
      <div class="submit-box" id="failBox" hidden>
        <h2>云端保存失败</h2>
        <p class="muted">
          条目已经保存在这台设备上，但没能上传到云端，所以其他设备暂时看不到。
          你可以稍后重试，或者用下面的方式手动提交。
        </p>
        <p class="gate-actions">
          <button type="button" class="btn" id="copyBtn">复制 JSON</button>
        </p>
        <p class="gate-error" id="copyState" hidden></p>
        <textarea id="copyManual" class="copy-manual" hidden spellcheck="false" aria-label="手动复制用的 JSON"></textarea>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/gui-entries.js"></script>
  <script src="js/gui-data.js"></script>
  <script src="js/gui-upload.js"></script>
  <script src="js/add-gui.js"></script>
</body>
</html>
