<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查看情报 · 鬼图鉴 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">    <p class="entry-back"><a id="backLink" href="projects.html">← 返回</a></p>

    <section class="hero">
      <h1>查看情报</h1>
      <p class="lead">这里只显示投稿的情报，不会出现在公开图鉴中。</p>
    </section>

    <section>
      <div class="gui-toolbar">
        <div class="gui-search">
          <svg class="gui-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="tipSearch" type="search" placeholder="搜索情报标题…" autocomplete="off" aria-label="搜索情报标题">
        </div>
        <div class="gui-actions">
          <a class="btn btn-ghost" href="provide-tip.html">提供情报</a>
        </div>
      </div>

      <p class="gui-count muted" id="tipCount">正在载入…</p>
      <div class="gui-list" id="tipList"></div>
      <div class="gui-empty" id="tipEmpty" hidden><p>还没有任何情报。</p></div>
    </section>  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/gui-entries.js"></script>
  <script src="js/gui-gate.js"></script>
  <script src="js/gui-data.js"></script>
  <script src="js/tips.js"></script>
</body>
</html>
