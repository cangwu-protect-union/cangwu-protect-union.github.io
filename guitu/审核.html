<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投稿审核 · 鬼图鉴 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <p class="entry-back"><a href="tips.html">← 返回情报</a></p>

    <!-- ===== 第一关：组织验证 ===== -->
    <section id="gateSection" class="gate">
      <h1>组织验证</h1>
      <p class="lead">审核投稿需要先验证身份。</p>
      <div id="gateMount"></div>
    </section>

    <!-- ===== 第二关：审核列表 ===== -->
    <section id="reviewSection" hidden>
      <h1>投稿审核</h1>
      <p class="lead">通过审核的情报才会出现在公开的情报列表里；驳回的只有验证后才看得到。</p>

      <div class="review-tabs" id="reviewTabs">
        <button type="button" class="btn btn-ghost is-on" data-status="pending">待审</button>
        <button type="button" class="btn btn-ghost" data-status="approved">已通过</button>
        <button type="button" class="btn btn-ghost" data-status="rejected">已驳回</button>
      </div>

      <p class="gui-count muted" id="reviewCount">正在载入…</p>

      <div class="review-list" id="reviewList"></div>

      <div class="gui-empty" id="reviewEmpty" hidden>
        <p>这里没有情报。</p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/gui-entries.js"></script>
  <script src="js/gui-gate.js"></script>
  <script src="js/gui-data.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
