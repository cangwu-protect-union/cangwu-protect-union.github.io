<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>增加区域 · 异常区域档案 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/quyu.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <p class="entry-back"><a href="edit-zones.html">← 返回编辑区</a></p>

    <section id="gateSection" class="gate">
      <h1>组织验证</h1>
      <p class="lead">回答以下问题，以验证身份。</p>
      <div id="gateMount"></div>
    </section>

    <section id="formSection" hidden>
      <h1>增加区域</h1>
      <p class="lead">填写完毕后点「确认」，区域会直接写入档案。</p>

      <form id="zoneForm" autocomplete="off">
        <div id="formMount"></div>

        <div class="picked-box" id="pickedBox" hidden>
          <p class="picked-box__title">已引用的投稿</p>
          <ul class="picked-list" id="pickedList"></ul>
          <p class="muted field-hint">保存后这些投稿会被标记为「已采纳」并链接到本区域。</p>
        </div>

        <div class="gate-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
          <button type="button" class="btn btn-ghost" id="pickTipsBtn">引用投稿</button>
          <button type="submit" class="btn" id="submitBtn">确认</button>
        </div>
      </form>
    </section>

    <section id="doneSection" hidden>
      <h1>区域已保存</h1>
      <p class="lead" id="doneText"></p>
      <p class="gate-actions">
        <a class="btn" id="doneView" href="quyu.html">查看该区域</a>
        <a class="btn btn-ghost" href="edit-zones.html">返回编辑区</a>
      </p>
      <p class="gate-error" id="adoptError" hidden></p>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/zone-seeds.js"></script>
  <script src="js/zone-data.js"></script>
  <script src="js/gui-gate.js"></script>
  <script src="js/zone-upload.js"></script>
  <script src="js/zone-form.js"></script>
  <script src="js/add-zone.js"></script>
</body>
</html>
