<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>引用条目 · 异常区域档案 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/quyu.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <h1>引用条目</h1>
    <p class="lead">勾选要关联的条目。鬼与区域可以互相引用，已关联的和自己不会出现在列表里。</p>

    <nav class="zone-tabs" id="relTabs" aria-label="条目类型">
      <a class="is-on" href="#" data-tab="ghost">鬼图鉴</a>
      <a href="#" data-tab="zone">异常区域</a>
    </nav>

    <div class="gui-search zone-rel-search">
      <svg class="gui-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="relSearch" type="search" placeholder="搜索标题…" autocomplete="off" aria-label="搜索标题">
    </div>

    <p class="gui-count muted" id="relCount">正在载入…</p>

    <ul class="pick-list" id="relList"></ul>

    <div class="gate-actions">
      <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
      <button type="button" class="btn" id="okBtn">确定</button>
    </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/zone-seeds.js"></script>
  <script src="js/relation-utils.js"></script>
  <script src="js/pick-relation.js"></script>
</body>
</html>
