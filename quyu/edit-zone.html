<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑区域 · 异常区域档案 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/quyu.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <p class="entry-back"><a href="edit-zones.html">← 返回编辑区</a></p>

    <section id="gateSection" class="gate">
      <h1>组织验证</h1>
      <p class="lead">回答以下问题，以验证身份。</p>
      <div id="gateMount"></div>
    </section>

    <section id="editSection" hidden>
      <h1 id="editTitle">编辑区域</h1>
      <p class="lead muted" id="editSub"></p>

      <p class="gui-actions" id="topActions">
        <a class="btn btn-ghost" id="viewLink" href="quyu.html">查看公开页</a>
        <a class="btn btn-ghost" id="historyLink" href="old-zones.html">旧档案</a>
      </p>

      <form id="zoneForm" autocomplete="off">
        <div id="formMount"></div>

        <p class="gate-error" id="saveError" hidden></p>

        <div class="gate-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">放弃修改</button>
          <button type="button" class="btn btn-danger" id="deleteBtn">删除区域</button>
          <button type="button" class="btn btn-ghost" id="restoreBtn" hidden>恢复区域</button>
          <button type="submit" class="btn" id="saveBtn">保存</button>
        </div>
      </form>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/zone-seeds.js"></script>
  <script src="js/zone-data.js"></script>
  <script src="js/gui-gate.js"></script>
  <script src="js/zone-upload.js"></script>
  <script src="js/zone-form.js"></script>
  <script src="js/edit-zone.js"></script>
</body>
</html>
