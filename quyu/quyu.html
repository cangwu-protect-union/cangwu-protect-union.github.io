<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>异常区域档案 · CPU</title>
  <meta name="description" content="CPU 异常区域档案：鬼频繁出没的异常区域公开记录">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/quyu.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>异常区域档案</h1>
      <p class="lead">组织标记的鬼活动区域，按地区与危险等级归档。</p>
    </section>

    <nav class="zone-tabs" aria-label="浏览方式">
      <a class="is-on" href="quyu.html">列表</a>
      <a href="map.html">地图</a>
    </nav>

    <section>
      <div class="zone-toolbar">
        <div class="gui-search">
          <svg class="gui-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="zoneSearch" type="search" placeholder="搜索区域名或正文…" autocomplete="off" aria-label="搜索区域">
        </div>
        <label class="zone-filter">
          <span class="visually-hidden">按地区筛选</span>
          <select id="zoneRegion" aria-label="按地区筛选">
            <option value="">全部地区</option>
          </select>
        </label>
      </div>

      <p class="gui-count muted" id="zoneCount">正在载入…</p>

      <div class="gui-list" id="zoneList"></div>

      <div class="gui-empty" id="zoneEmpty" hidden>
        <p>没有找到匹配的区域。</p>
      </div>

      <nav class="gui-pager" id="zonePager" hidden aria-label="分页"></nav>
    </section>

    <section class="zone-legend">
      <h2>等级与状态</h2>
      <p class="muted">危险等级沿用《灵异现象等级划分》，与鬼图鉴一致。</p>
      <ul class="zone-legend-list">
        <li><span class="zone-badge zone-level" data-level="A">A 级</span>已确认存在实体，对人类构成直接威胁</li>
        <li><span class="zone-badge zone-level" data-level="B">B 级</span>存在间歇性实体显现，威胁可控</li>
        <li><span class="zone-badge zone-level" data-level="C">C 级</span>仅观测到异常现象，未见实体</li>
        <li><span class="zone-badge zone-level" data-level="D">D 级</span>无法排除误报，需二次核实</li>
      </ul>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/zone-seeds.js"></script>
  <script src="js/zone-data.js"></script>
  <script src="js/zones.js"></script>
</body>
</html>
