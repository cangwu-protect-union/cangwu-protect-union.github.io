<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/style.css">

<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>

  <main class="container">

    <section id="gateSection" class="gate">
      <h1>组织验证</h1>
      <p class="lead">回答以下问题，以验证身份。</p>
      <div id="gateMount"></div>
    </section>

    <section id="pickSection" hidden>
      <h1>引用投稿</h1>
      <p class="lead">勾选要收进这条区域的投稿。保存区域后，它们会被标成「已采纳」。</p>

      <p class="gui-count muted" id="pickCount">正在载入…</p>

      <ul class="pick-list" id="pickList"></ul>

      <div class="gate-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
        <button type="button" class="btn" id="okBtn">确定引用</button>
      </div>
    </section>

  </main>

  <footer class="site-footer">
