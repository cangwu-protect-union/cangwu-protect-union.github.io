<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑条目 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <p class="entry-back"><a href="edit-gui.html">← 返回编辑图鉴</a></p>

    <section id="loading"><p class="muted">正在载入条目…</p></section>

    <section id="editArea" hidden>
      <h1 class="editor-title">编辑条目</h1>
      <p class="lead">改完后点底部「确认」，会先验证身份，再把旧版本存进「旧图鉴」。</p>

      <div class="field">
        <label for="fTitle">标题</label>
        <input id="fTitle" type="text" maxlength="60">
      </div>

      <div class="field">
        <label>文段 <span class="muted">（每段一个输入框，可单独删除）</span></label>
        <div id="paraList" class="para-list"></div>
        <p><button type="button" class="btn btn-ghost" id="addParaBtn">+ 添加文段</button></p>
      </div>

      <div class="field">
        <label>图片 <span class="muted">（可多张，点 × 移除）</span></label>
        <div id="imgList" class="thumbs" hidden></div>
        <p>
          <input id="imgFile" type="file" accept="image/*" multiple hidden>
          <button type="button" class="btn btn-ghost" id="addImgBtn">+ 添加图片</button>
          <span class="img-status muted" id="imgStatus"></span>
        </p>
      </div>

      <div class="field">
        <label for="fTags">标签 <span class="muted">（用逗号分隔）</span></label>
        <input id="fTags" type="text" placeholder="异次元, 已镇压">
      </div>

      <p class="gate-error" id="formError" hidden></p>

      <div class="gate-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
        <button type="button" class="btn" id="saveBtn">确认</button>
      </div>

      <hr class="editor-sep">

      <div class="danger-zone">
        <p class="muted">删除条目后它不会再出现在图鉴里，但旧内容会存进「旧图鉴」，以后可以恢复。</p>
        <button type="button" class="btn btn-danger" id="deleteBtn">删除条目</button>
      </div>
    </section>

    <section id="notFound" hidden>
      <h1>条目不存在</h1>
      <p class="lead">链接里的编号不正确，或者条目已被删除。</p>
      <p><a class="btn" href="edit-gui.html">返回编辑图鉴</a></p>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="data/config.js"></script>
  <script src="data/gui-entries.js"></script>
  <script src="js/gui-gate.js"></script>
  <script src="js/gui-data.js"></script>
  <script src="js/gui-upload.js"></script>
  <script src="js/edit-entry.js"></script>
</body>
</html>
