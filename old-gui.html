  <main class="container">    <p class="entry-back"><a href="edit-gui.html">← 返回编辑图鉴</a></p>

    <section class="hero">
      <h1>旧图鉴</h1>
      <p class="lead">被修改或删除的条目会归档到这里。白色表示条目仍在图鉴中，灰色表示已删除。</p>
    </section>

    <section>
      <div class="gui-toolbar">
        <div class="gui-search">
          <svg class="gui-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="oldSearch" type="search" placeholder="搜索旧条目名…" autocomplete="off" aria-label="搜索旧条目名">
        </div>
      </div>

      <p class="gui-count muted" id="oldCount">正在载入…</p>
      <div class="old-grid" id="oldGrid"></div>
      <div class="gui-empty" id="oldEmpty" hidden><p>旧图鉴还是空的。</p></div>
    </section>  </main>
