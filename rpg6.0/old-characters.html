  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>

      </nav>
    </div>
  </header>

  <main class="container">

    <p class="entry-back"><a href="edit-characters.html">← 返回编撰档案</a></p>

    <section id="gateSection" class="gate">
      <h1>组织验证</h1>
      <p class="lead">查看旧档案需要先验证身份。</p>
      <div id="gateMount"></div>
    </section>

    <section id="oldSection" hidden>
      <h1>旧档案</h1>
      <p class="lead">被修改或删除过的角色都在这里。点进去可以看每一个历史版本。</p>

      <div class="gui-toolbar">
        <div class="gui-search">
          <svg class="gui-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="oldSearch" type="search" placeholder="搜索角色名…" autocomplete="off" aria-label="搜索旧档案">
        </div>
      </div>

      <p class="gui-count muted" id="oldCount">正在载入…</p>

      <div class="old-grid" id="oldGrid"></div>

      <div class="gui-empty" id="oldEmpty" hidden>
        <p>旧档案还是空的。</p>
      </div>
    </section>

  </main>
