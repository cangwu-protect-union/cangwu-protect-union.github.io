<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编撰档案 · 回合制正传6.0 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/archive.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <p class="entry-back"><a href="../projects.html">← 返回项目</a></p>

    <section id="gateSection" class="gate">
      <h1>编撰档案</h1>
      <p class="lead">编纂角色档案需要先通过组织验证。</p>
      <div id="gateMount"></div>
    </section>

    <section id="editSection" hidden>
      <h1>编撰档案</h1>
      <p class="lead">编辑、删除或恢复角色。新增角色必须走投稿与审核。</p>

      <div class="gui-actions">
        <a class="btn" href="review.html">审核投稿</a>
        <a class="btn btn-ghost" href="old-characters.html">查看旧档案</a>
        <a class="btn btn-ghost" href="rpg6.0.html">返回公开档案</a>
      </div>

      <div class="rpg-filters">
        <label class="rpg-field rpg-field-grow">
          <span>搜索</span>
          <input id="adminSearch" type="search" placeholder="名称、别名、职业…" autocomplete="off" aria-label="搜索角色">
        </label>
        <label class="rpg-field">
          <span>状态</span>
          <select id="adminState" aria-label="按状态筛选">
            <option value="all">全部</option>
            <option value="live">在档</option>
            <option value="deleted">已删除</option>
          </select>
        </label>
        <label class="rpg-field">
          <span>排序</span>
          <select id="adminOrder" aria-label="排序方式">
            <option value="asc">时间正序</option>
            <option value="desc">时间倒序</option>
          </select>
        </label>
      </div>

      <p class="gui-count muted" id="adminCount">正在载入…</p>
      <p class="rpg-status" id="adminStatus" hidden></p>

      <div class="rpg-admin-list" id="adminList"></div>

      <div class="gui-empty" id="adminEmpty" hidden>
        <p>没有找到角色。</p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="../guitu/data/config.js"></script>
  <script src="data/config.js"></script>
  <script src="../guitu/js/gui-gate.js"></script>
  <script src="js/rpg-data.js"></script>
  <script src="js/rpg-form.js"></script>
  <script src="js/edit-characters.js"></script>
</body>
</html>
