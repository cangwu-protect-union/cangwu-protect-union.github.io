<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>回合制正传 6.0 · 对局测试 · CPU</title>
  <meta name="robots" content="noindex">
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
  <meta name="x5-fullscreen" content="true">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/style-2.css">
  <link rel="stylesheet" href="../css/style-3.css">
  <link rel="stylesheet" href="css/battle.css">
  <link rel="stylesheet" href="css/battle-detail.css">
</head>
<body>

  <div class="rotate-gate" data-gate>
    <div class="gate-box">
      <p class="gate-title">请横屏</p>
      <p class="gate-note" data-gate-note>对局要同时看双方状态，竖屏放不下。</p>
      <button type="button" class="btn" data-gate-go>横屏继续</button>
    </div>
  </div>

  <div class="buff-pop" data-buffpop hidden></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../projects.html">项目</a>
        <a href="rpg6.0.html">角色档案</a>
        <a href="rules.html">规则</a>
        <a href="battles.html">战报</a>
      </nav>
    </div>
  </header>

  <main class="container battle-page">

    <section class="battle-setup" data-setup>
      <h1>回合制正传 6.0 · 对局测试</h1>
      <p class="lead">1v1，双方都由人操作。速度低者先手，同速由种子决定。</p>
      <div class="setup-row">
        <label>甲
          <select data-pick-a></select>
        </label>
        <label>乙
          <select data-pick-b></select>
        </label>
        <label>种子
          <input data-seed type="text" inputmode="numeric" placeholder="留空则随机">
        </label>
        <button type="button" class="btn" data-start>开始对局</button>
      </div>
      <p class="setup-note" data-source>正在读取角色…</p>
      <p><button type="button" class="btn btn-ghost" data-resume hidden></button></p>
      <p class="setup-note" data-coverage>正在读取技能库…</p>
    </section>

    <section class="battle-stage" data-stage hidden>
      <div class="battle-grid" data-grid></div>
      <div class="battle-bar" data-bar>
        <span class="bb-turn" data-turn></span>
        <span class="bb-hint" data-hint></span>
        <span class="bb-replay" data-replay hidden>
          <button type="button" class="btn btn-ghost" data-step-start>开局</button>
          <button type="button" class="btn btn-ghost" data-step-prev>上一步</button>
          <button type="button" class="btn btn-ghost" data-step-next>下一步</button>
          <button type="button" class="btn btn-ghost" data-step-end>结局</button>
          <button type="button" class="btn btn-ghost" data-takeover>从这里接着打</button>
          <span class="bb-step" data-step-info></span>
        </span>
        <button type="button" class="btn btn-ghost" data-undo>撤销一步</button>
        <button type="button" class="btn btn-ghost" data-restart>换人</button>
      </div>
      <section class="battle-result" data-result hidden></section>
    </section>

    <p><a class="btn btn-ghost" href="../projects.html">← 返回项目</a></p>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="../js/visit-beacon.js"></script>
  <script src="../guitu/data/config.js"></script>
  <script src="data/config.js"></script>
  <script src="data/seeds/characters.js"></script>
  <script src="data/seeds/characters-2.js"></script>
  <script src="data/seeds/characters-3.js"></script>
  <script src="data/seeds/characters-4.js"></script>
  <script type="module" src="js/battle/entry.js"></script>

</body>
</html>
