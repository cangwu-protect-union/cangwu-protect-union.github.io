  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>

        <a href="../index.html">首页</a>

  <main class="container">

    <p class="entry-back"><a href="rpg6.0.html">← 返回档案</a></p>

    <section id="tipIntro">
      <h1>提供投稿</h1>
      <p class="lead">按模板填写角色。投稿不需要验证；通过审核后会进入角色档案。</p>
      <p class="field-hint">审核时可以修改内容，但修改只写进档案，不会改回你的投稿。</p>
    </section>

    <section id="tipForm" class="rpg-section">
      <div id="formRoot"></div>

      <div class="rpg-submit">
        <button type="button" class="btn" id="submitBtn">提交投稿</button>
        <span class="muted" id="submitStatus"></span>
      </div>
    </section>

    <section id="tipDone" hidden>
      <h1>投稿已提交</h1>
      <p class="lead">等待审核。审核由回合制游戏工作室成员执行。</p>
      <p class="rpg-actions">
        <button type="button" class="btn" id="againBtn">再投一份</button>
        <a class="btn btn-ghost" href="rpg6.0.html">查看档案</a>
      </p>
    </section>

    <p class="rpg-foot-link muted"><a href="review.html">成员审核投稿 →</a></p>

  </main>
