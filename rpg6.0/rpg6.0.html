<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色档案 · 回合制正传6.0 · CPU</title>
  <meta name="description" content="回合制正传6.0的角色档案：查阅、投稿与编纂">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/archive.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>角色档案</h1>
      <p class="lead">回合制正传 6.0 的角色记录。按模板整理：审核评价、角色名称、职业、六维与技能。</p>
    </section>

    <nav class="rpg-tabs" aria-label="档案分类">
      <a class="is-on" href="rpg6.0.html">角色</a>
      <a href="rules.html">规则</a>
    </nav>

    <section>
      <div class="rpg-toolbar">
        <div class="gui-search">
          <svg class="gui-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="rpgSearch" type="search" placeholder="搜索名称、别名、技能…" autocomplete="off" aria-label="搜索角色">
        </div>
        <a class="btn" href="provide-tip.html">提供投稿</a>
      </div>

      <div class="rpg-filters">
        <label class="rpg-field">
          <span>评级</span>
          <select id="rpgRating" aria-label="按评级筛选">
            <option value="">全部评级</option>
          </select>
        </label>
        <label class="rpg-field">
          <span>职业</span>
          <select id="rpgOcc" aria-label="按职业筛选">
            <option value="">全部职业</option>
          </select>
        </label>
        <label class="rpg-field">
          <span>排序</span>
          <select id="rpgOrder" aria-label="排序方式">
            <option value="asc">时间正序</option>
            <option value="desc">时间倒序</option>
          </select>
        </label>
        <button type="button" class="btn btn-ghost" id="rpgReset">重置</button>
      </div>

      <p class="gui-note rpg-note" id="rpgNote" hidden></p>

      <p class="gui-count muted" id="rpgCount">正在载入…</p>

      <div class="gui-list" id="rpgList"></div>

      <div class="gui-empty" id="rpgEmpty" hidden>
        <p>没有符合条件的角色档案。</p>
      </div>

      <nav class="gui-pager" id="rpgPager" hidden aria-label="分页"></nav>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="../guitu/data/config.js"></script>
  <script src="data/config.js"></script>
  <script src="data/characters.js"></script>
  <script src="js/rpg-data.js"></script>
  <script src="js/list.js"></script>
</body>
</html>
