<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑角色 · 回合制正传6.0 · CPU</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/archive.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">CPU及回合制游戏工作室联合组织</a>
      <nav>
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../projects.html">项目</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <p class="entry-back"><a id="backLink" href="edit-characters.html">← 返回编撰档案</a></p>

    <section id="gateSection" class="gate">
      <h1>组织验证</h1>
      <p class="lead">编辑角色需要先验证身份。</p>
      <div id="gateMount"></div>
    </section>

    <section id="editSection" hidden>
      <h1 id="pageTitle">编辑角色</h1>
      <p class="lead" id="pageLead">改完保存即可；保存前会把当前内容存入旧档案。</p>

      <div id="formRoot"></div>

      <div class="rpg-submit" id="editFooter" hidden>
        <label class="field field-inline">
          <span class="field-label">保存人 <em>必填</em></span>
          <select id="operatorSel" aria-label="保存人"></select>
        </label>
        <button type="button" class="btn" id="saveBtn">保存</button>
        <button type="button" class="btn btn-danger" id="deleteBtn" hidden>删除这条档案</button>
      </div>

      <div class="rpg-submit" id="reviewFooter" hidden>
        <div class="rpg-review-fields">
          <label class="field field-inline">
            <span class="field-label">审核人 <em>必填</em></span>
            <select id="reviewerSel" aria-label="审核人"></select>
          </label>
          <label class="field field-inline">
            <span class="field-label">审核评价 <em>必填</em></span>
            <select id="markSel" aria-label="审核评价"></select>
          </label>
          <label class="field rpg-field-grow">
            <span class="field-label">审核备注<span class="field-hint">可留空</span></span>
            <textarea id="reviewNote" rows="2" maxlength="200"></textarea>
          </label>
        </div>
        <button type="button" class="btn" id="approveBtn">保存并建立角色</button>
      </div>

      <p class="rpg-status" id="editStatus" hidden></p>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 CPU及回合制游戏工作室联合组织</p>
    </div>
  </footer>

  <script src="../guitu/data/config.js"></script>
  <script src="data/config.js"></script>
  <script src="../guitu/js/gui-gate.js"></script>
  <script src="js/rpg-data.js"></script>
  <script src="js/rpg-form.js"></script>
  <script src="js/edit-character.js"></script>
</body>
</html>
